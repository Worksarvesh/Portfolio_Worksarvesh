<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarvesh Sharma — Portfolio</title>
    <!-- Redirect any 404 back to the SPA root.
         GitHub Pages serves this file for any unknown path.
         We immediately redirect to the index so HashRouter can handle routing. -->
    <script>
      // Preserve the path in sessionStorage so the app can read it if needed.
      sessionStorage.setItem('ghpages_redirect', window.location.href);
      // Redirect to the app root — HashRouter handles everything from here.
      window.location.replace('/Portfolio_Worksarvesh/');
    </script>
  </head>
  <body></body>
</html>
